# cairn.toml — the schema for this project's roadmap and issues.
#
# Everything here is configurable: the item types, the statuses they move
# through, any extra fields you want to track, the milestones, the saved views,
# and how ROADMAP.md gets rendered. Delete what you do not need.
#
#   cairn config          show the resolved schema
#   cairn check           validate every item against it
#   man cairn             full reference

format = 1

[project]
name = "cairn"
description = "A markdown-native roadmap and issue manager that lives in your repository."
dir = "cairn/items"           # where item files live, relative to this file
id_width = 4              # 0001, 0002, ...
default_type = "feature"
default_status = "backlog"
url = "https://github.com/oddurs/cairn/blob/main"

# ─── Item types ──────────────────────────────────────────────────────────────
# `template` seeds the body of new items of that type, so every bug report and
# every feature arrives with the same headings.

[[type]]
name = "feature"
icon = "+"
color = "cyan"
template = """
## Problem

## Proposal

## Acceptance criteria

- [ ]
"""

[[type]]
name = "bug"
icon = "!"
color = "red"
template = """
## What happens

## What should happen

## Reproduction

1.
"""

[[type]]
name = "chore"
icon = "~"
color = "gray"

[[type]]
name = "docs"
icon = "*"
color = "blue"

# ─── Statuses ────────────────────────────────────────────────────────────────
# Order matters: it is the column order on the board and the sort order in
# listings. `category` is what the tool reasons about — open / active / done /
# dropped — so you can rename the statuses themselves to anything you like.

[[status]]
name = "backlog"
category = "open"
color = "gray"

[[status]]
name = "planned"
category = "open"
color = "blue"

[[status]]
name = "doing"
label = "in progress"
category = "active"
color = "yellow"

[[status]]
name = "blocked"
category = "active"
color = "red"

[[status]]
name = "done"
category = "done"
color = "green"

[[status]]
name = "dropped"
category = "dropped"
color = "gray"
board = false             # hide this column on `cairn board`

# ─── Custom fields ───────────────────────────────────────────────────────────
# kind = text | enum | list | date | number | bool
# `column = true` puts the field in the default `cairn list` table.
# Enum values are ordered: `cairn list --sort priority` respects that order.

[[field]]
name = "priority"
kind = "enum"
values = ["p0", "p1", "p2", "p3"]
default = "p2"
column = true
description = "p0 is a release blocker"

[[field]]
name = "effort"
kind = "enum"
values = ["s", "m", "l", "xl"]
description = "Rough size, not an estimate"

[[field]]
name = "sprint"
kind = "enum"
values = ["s1", "s2", "s3", "s4", "s5"]
column = true
description = "Durability sprint; see ROADMAP.md"

[[field]]
name = "area"
kind = "text"
description = "Subsystem this touches"

# ─── Milestones ──────────────────────────────────────────────────────────────
# Sections of the rendered roadmap, in due-date order.

[[milestone]]
name = "v0.1"
title = "Usable in anger"
due = "2026-10-15"
description = "Enough to run a real project's roadmap without reaching for anything else."

[[milestone]]
name = "v0.2"
title = "Comfortable"
due = "2026-12-01"
description = "The rough edges that show up after a few weeks of daily use, and the pieces that make the central claim true rather than merely stated."

[[milestone]]
name = "v1.0"
title = "Stable"
due = "2027-03-01"
description = "Safe to depend on: every scriptable surface carries a promise, the command surface has been reviewed and pruned rather than accumulated, releases can be verified, and it installs from a package manager people already use."

[[milestone]]
name = "later"
title = "Someday"
description = "Good ideas without a date yet."

# ─── Saved views ─────────────────────────────────────────────────────────────
# `cairn list --view next`, `cairn board --view triage`

[[view]]
name = "now"
description = "What is actually being worked on"
filter = "category=active"
sort = "priority,id"

[[view]]
name = "next"
description = "Planned work for the nearest milestone"
filter = "status=planned"
sort = "priority,milestone"

[[view]]
name = "sprint"
description = "The current durability sprint, in order"
filter = "sprint=s1,category!=done"
sort = "priority,id"

[[view]]
name = "triage"
description = "Items that still need a milestone or a priority"
filter = "milestone=,category!=done"
columns = ["id", "type", "title", "created"]

# ─── Hooks ───────────────────────────────────────────────────────────────────
# Keeping the rendered roadmap current is the point, so it is done rather than
# remembered. See "Hooks" in the manual for the shell and argv forms.

[hooks]
after-create = "cairn render -q"
after-change = "cairn render -q"
after-remove = "cairn render -q"

# ─── Rendered roadmap ────────────────────────────────────────────────────────

[render]
target = "ROADMAP.md"
title = "Roadmap"
group_by = "milestone"    # any field works: milestone, area, assignee, type
include = "category!=dropped"
checkbox = true           # render items as a task list
show_ids = true
progress = true           # per-milestone progress bar
group_by_status = true    # sub-group each section by status
link_items = true         # requires project.url
# header = "docs/roadmap-intro.md"   # spliced in above the generated body
# footer = "docs/roadmap-outro.md"
