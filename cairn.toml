# cairn.toml — the schema for this project's roadmap and issues.
#
# Everything here is configurable: the item types, the statuses they move
# through, any extra fields you want to track, the milestones, the saved views,
# and how ROADMAP.md gets rendered. Delete what you do not need.
#
#   cairn config          show the resolved schema
#   cairn check           validate every item against it
#   man cairn             full reference

format = 4

[project]
name = "cairn"
description = "Project memory, versioned with the code. Plain Markdown, a schema you own, and a shared workflow for people and agents."
dir = "cairn/items"           # where item files live, relative to this file
default_type = "feature"
default_status = "backlog"
url = "https://github.com/oddurs/cairn/blob/main"
claim_stale_after = 7     # surface an abandoned claim; never release it automatically
# Keep historical checkboxes honest. Many early closed items predate criteria
# discipline; do not tick them just to enable require_criteria globally.

# ─── Item types ──────────────────────────────────────────────────────────────
# `template` seeds the body of new items of that type, so every bug report and
# every feature arrives with the same headings.

[[type]]
name = "feature"
icon = "+"
color = "cyan"
template = """
## Problem

## Proposal

## Acceptance criteria

- [ ]
"""

[[type]]
name = "bug"
icon = "!"
color = "red"
template = """
## What happens

## What should happen

## Reproduction

1.

## Acceptance criteria

- [ ] A regression check reproduces the failure and passes with the fix.
- [ ] User-visible behaviour and any recovery steps are documented.
"""

[[type]]
name = "chore"
icon = "~"
color = "gray"
template = """
## Purpose

## Approach

## Acceptance criteria

- [ ]
"""

[[type]]
name = "docs"
icon = "*"
color = "blue"
template = """
## Reader and question

## Change

## Acceptance criteria

- [ ] The reader can complete the described task with the current program.
"""

[[type]]
name = "decision"
icon = "?"
color = "magenta"
description = "A choice worth remembering after the work is finished"
template = """
## Context

## Options and tradeoffs

## Decision

## Revisit when

## Acceptance criteria

- [ ] The choice, its evidence, and its consequences are recorded.
"""

[[type]]
name = "milestone"
description = "An outcome to ship; dates are commitments, not placeholders"
groups = "one"
inverse = "scheduled"
template = """
Describe the outcome in one paragraph; this appears in the roadmap.

## Release gate

State what must be true to ship. Keep executable work in linked items.
"""

# ─── Statuses ────────────────────────────────────────────────────────────────
# Order matters: it is the column order on the board and the sort order in
# listings. `category` is what the tool reasons about — open / active / done /
# dropped — so you can rename the statuses themselves to anything you like.

[[status]]
name = "backlog"
category = "open"
color = "gray"
label = "not committed"

[[status]]
name = "planned"
category = "open"
color = "blue"
label = "up next"

[[status]]
name = "doing"
label = "in progress"
category = "active"
color = "yellow"

[[status]]
name = "blocked"
category = "open"
color = "red"
label = "waiting"
# Waiting is not work in progress. The `blocked` query field separately means
# unfinished dependencies; status names alone do not affect `cairn next`.

[[status]]
name = "done"
category = "done"
color = "green"

[[status]]
name = "dropped"
category = "dropped"
color = "gray"
board = false             # hide this column on `cairn board`

# ─── Custom fields ───────────────────────────────────────────────────────────
# kind = text | enum | list | date | number | bool
# `column = true` puts the field in the default `cairn list` table.
# Enum values are ordered: `cairn list --sort priority` respects that order.

[[field]]
name = "priority"
kind = "enum"
values = ["p0", "p1", "p2", "p3"]
default = "p2"
column = true
description = "p0: data loss or broken core workflow; p1: next outcome; p2: useful; p3: optional"

[[field]]
name = "effort"
kind = "enum"
values = ["s", "m", "l", "xl"]
description = "Rough size, not an estimate"

[[field]]
name = "sprint"
kind = "enum"
values = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9", "s10", "s11", "s12"]
column = false
description = "Historical durability sprint; retained for old items, not assigned to new work"

[[field]]
name = "area"
kind = "text"
description = "Subsystem: workflow, git, format, integration, cli, docs, distribution, or direction"

[[field]]
name = "due"
kind = "date"
description = "A committed date, YYYY-MM-DD; leave unset when the release is gated by evidence"

# ─── Saved views ─────────────────────────────────────────────────────────────
# `cairn list --view next`, `cairn board --view triage`

[[view]]
name = "now"
description = "Work someone is doing now"
filter = "category=active,type!=milestone"
sort = "priority,id"
columns = ["id", "status", "assignee", "priority", "title"]

[[view]]
name = "next"
description = "Approved work with no unfinished dependencies"
filter = "status=planned|doing,blocked=false,type!=milestone"
sort = "priority,milestone"
columns = ["id", "priority", "area", "title"]

[[view]]
name = "waiting"
description = "Needs an external action or a decision; read the item's note"
filter = "status=blocked,type!=milestone"
sort = "priority,id"
columns = ["id", "owner", "priority", "title"]

[[view]]
name = "dependencies"
description = "Work held by an unfinished dependency"
filter = "blocked=true,category=open|active,type!=milestone"
sort = "priority,id"

[[view]]
name = "triage"
description = "Unscheduled ideas to accept, defer, or drop"
filter = "status=backlog,milestone=,type!=milestone"
columns = ["id", "type", "title", "created"]

[[view]]
name = "later"
description = "Options without a commitment to build them"
filter = "milestone=later,category=open|active,type!=milestone"
sort = "priority,id"

[[view]]
name = "decisions"
description = "Explicitly typed decisions; search --all also finds reasoning in older work"
filter = "type=decision,category=open|active|done|dropped"
sort = "-updated,id"

[[view]]
name = "history"
description = "Finished and dropped records, by last edit (not completion date)"
filter = "category=done|dropped,type!=milestone"
sort = "-updated,id"

# ─── Hooks ───────────────────────────────────────────────────────────────────
# Keeping the rendered roadmap current is the point, so it is done rather than
# remembered. See "Hooks" in the manual for the shell and argv forms.

[hooks]
after-create = ["cairn", "render", "-q"]
after-change = ["cairn", "render", "-q"]
after-remove = ["cairn", "render", "-q"]

# ─── Rendered roadmap ────────────────────────────────────────────────────────

[render]
target = "ROADMAP.md"
title = "Roadmap"
group_by = "milestone"    # any field works: milestone, area, assignee, type
include = "category=open|active"
checkbox = true           # render items as a task list
show_ids = true
progress = false          # an open-work view cannot show meaningful completion percentages
group_by_status = true    # sub-group each section by status
link_items = true         # requires project.url
header = "doc/roadmap-intro.md"
# footer = "docs/roadmap-outro.md"
