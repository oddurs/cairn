[package]
# `cairn` and `cairn-cli` are both taken on crates.io by unrelated crates, so the
# package is published as `cairn-md`. The binary it installs is still `cairn`.
name = "cairn-md"
version = "0.1.0"
edition = "2024"
# let-chains (`if let ... && let ...`) stabilised in 1.88; edition 2024 alone
# would only need 1.85.
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Markdown-native roadmap and issue manager that lives in your repository"
readme = "README.md"
repository = "https://github.com/oddurs/cairn"
homepage = "https://github.com/oddurs/cairn"
documentation = "https://github.com/oddurs/cairn/blob/main/doc/cairn.texi"
exclude = ["/.github", "/doc/demo.svg", "/tests/golden"]
keywords = ["roadmap", "issues", "markdown", "project-management", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Oddur Sigurdsson <oddurs@gmail.com>"]

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
terminal_size = "0.4.4"
toml = "1.1.5"
toml_edit = "0.25.13"
unicode-width = "0.2.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
