[package]
# `cairn` and `cairn-cli` are both taken on crates.io by unrelated crates, so the
# package is published as `cairn-md`. The binary it installs is still `cairn`.
name = "cairn-md"
version = "0.3.0"
edition = "2024"
# let-chains (`if let ... && let ...`) stabilised in 1.88; edition 2024 alone
# would only need 1.85.
rust-version = "1.88"
license = "MIT"
description = "Markdown-native roadmap and issue manager that lives in your repository"
readme = "README.md"
repository = "https://github.com/oddurs/cairn"
homepage = "https://github.com/oddurs/cairn"
documentation = "https://github.com/oddurs/cairn/blob/main/doc/cairn.texi"
exclude = ["/.github", "/doc/demo.svg", "/tests/golden"]
keywords = ["roadmap", "issues", "markdown", "project-management", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Oddur Sigurdsson <oddurs@gmail.com>"]

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
terminal_size = "0.4.4"
toml = "1.1.5"
toml_edit = "0.25.13"
unicode-width = "0.2.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

# Pedantic is on, and the exceptions are argued rather than silent. Anything not
# listed here is expected to be fixed, not allowed at the site.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# A command's argument struct is a `clap` derive: it is constructed once, passed
# once, and read. Taking it by reference would put a lifetime in every signature
# to save a move that never happens twice.
needless_pass_by_value = "allow"

# The same structs: a flag per option is what a command line is. Grouping them
# into sub-structs to satisfy a count would hide the shape of the interface.
struct_excessive_bools = "allow"

# Progress bars, column widths and percentages. The values are bounded by a
# terminal or by the size of a backlog; a cast that could matter is written out
# with the bound stated instead.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# A command that does one thing end to end reads better whole than split into
# helpers that exist only to be short and are each called once.
too_many_lines = "allow"

# In struct-literal position the field already names the type, and
# `Default::default()` there follows it if it ever changes. Naming the type a
# second time is a restatement, not a clarification.
default_trait_access = "allow"

# Every command returns `Result<i32>` so one `match` in `main` can dispatch them
# all. Two of them cannot currently fail; narrowing those two would buy nothing
# and cost the uniformity that makes the dispatch one line per command.
unnecessary_wraps = "allow"

# `clap` derive: the struct is named for its command and its fields for the
# command's arguments, so `SetArgs.args` and `Hooks.after_create` are the
# interface as a person types and writes it.
struct_field_names = "allow"

# The alternative is `write!(s, ..)` plus a `use std::fmt::Write` and a `Result`
# discarded at every site, for a push to a `String` that cannot fail. The
# harness builds schema TOML this way in seventy places and reads better for it.
format_push_string = "allow"

# A harness method belongs to `Project` because that is what it operates on.
# One of them not reading a field is an implementation detail, not a reason to
# make the caller write `Project::` instead of `p.`.
unused_self = "allow"
