name: release

# Tagging v0.1.0 builds a binary for every supported platform, publishes them to
# the GitHub release with checksums, and pushes the crate. Nothing is built by
# hand, so what people download is what CI produced from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl gives a static binary, so one Linux artefact works on any distro.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="cairn-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/cairn.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/cairn" "dist/${name}/"
          fi
          # COPYING, not LICENSE: the file was renamed when the repository was
          # laid out the GNU way, and this step still asked for the old name —
          # which `set -e` turned into four failed builds on the first tag.
          cp README.md COPYING "dist/${name}/"
          cp doc/cairn.texi "dist/${name}/" 2>/dev/null || true
          # Under its own name: copying spec/README.md into the directory would
          # land it on top of the project's README.
          cp spec/README.md "dist/${name}/FORMAT.md" 2>/dev/null || true
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" >/dev/null
            certutil -hashfile "${name}.zip" SHA256 | sed -n 2p | tr -d ' \r' > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" | cut -d' ' -f1 > "${name}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          for f in *.sha256; do
            printf '%s  %s\n' "$(cat "$f")" "${f%.sha256}"
          done > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  crate:
    needs: build
    runs-on: ubuntu-latest
    # Skipped silently when the token is absent, so forks can tag without failing.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "No CARGO_REGISTRY_TOKEN set; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked
