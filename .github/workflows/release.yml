name: release

# Tagging v0.1.0 builds a binary for every supported platform, publishes them to
# the GitHub release with checksums, and pushes the crate. Nothing is built by
# hand, so what people download is what CI produced from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance: GitHub signs an attestation saying which workflow, from
  # which commit, produced which file. It needs no key of ours, and it is the
  # one guarantee checksums cannot give — they come from the same workflow as
  # the artefacts, so they prove the download arrived intact and nothing about
  # where it came from.
  id-token: write
  attestations: write

jobs:
  # Nothing is built until the tag, Cargo.toml, NEWS and Cargo.lock agree.
  #
  # These were checkboxes in RELEASING.md, and the first of them is the one the
  # whole document exists for: the binaries are named from the tag and the
  # source tarball from Cargo.toml, so a tag that disagrees ships one release
  # holding two version numbers, with a binary whose --version contradicts the
  # file it arrived in. `make release-check` is the same check a person runs
  # before tagging, so there is one implementation and not two.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refuse anything that is not a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "This workflow releases a tag. Dispatched on a branch it would" >&2
          echo "name every artefact after the branch and publish a release for" >&2
          echo "it. Re-run it with a tag selected as the ref." >&2
          exit 1
      - run: make release-check TAG=${{ github.ref_name }}

  build:
    needs: preflight
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner rather than built on macos-13.
          # Apple ships both toolchains, and GitHub is retiring its Intel
          # runners: the first tag sat queued for twenty minutes waiting for one.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl gives a static binary, so one Linux artefact works on any distro.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="cairn-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/cairn.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/cairn" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cp doc/cairn.texi "dist/${name}/" 2>/dev/null || true
          # Under its own name: copying spec/README.md into the directory would
          # land it on top of the project's README.
          cp spec/README.md "dist/${name}/FORMAT.md" 2>/dev/null || true
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" >/dev/null
            certutil -hashfile "${name}.zip" SHA256 | sed -n 2p | tr -d ' \r' > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" | cut -d' ' -f1 > "${name}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  source:
    # A tarball built from the tag, for packagers and for anybody auditing a
    # release without depending on the forge staying up. `git archive` is
    # deterministic, so `make dist` on your own machine produces these same
    # bytes — which is the only version of that claim worth making.
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make dist
      - run: |
          f=$(ls cairn-*.tar.gz)
          sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            cairn-*.tar.gz
            cairn-*.tar.gz.sha256

  publish:
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          for f in *.sha256; do
            printf '%s  %s\n' "$(cat "$f")" "${f%.sha256}"
          done > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - name: Attest what built these
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # Detached signatures, when there is a key to make them with. Absent, the
      # release still happens: a workflow that fails on a missing secret is a
      # workflow that stops a fork from tagging, and the checksums and the
      # attestation above stand on their own. Add GPG_PRIVATE_KEY and
      # GPG_PASSPHRASE and every artefact gains a .asc without another change
      # here.
      - name: Sign the artefacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "No GPG_PRIVATE_KEY set; releasing without signatures."
            echo "See doc/cairn.texi, \"Verifying a release\", for what this costs."
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
          done
          gpg --list-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}'

      # The release body is what somebody deciding whether to upgrade reads, and
      # NEWS is where this project writes that down in terms of what a user
      # would notice. A generated list of commit subjects is not that, so it is
      # kept underneath rather than instead.
      - name: Release notes, from NEWS
        run: make release-notes > NOTES.md && cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: NOTES.md
          generate_release_notes: true

  crate:
    # After the GitHub release, not beside it. crates.io cannot be unpublished,
    # so it is the last thing that should happen and the first thing that would
    # be irreversible if the release turned out wrong.
    needs: [build, source, publish]
    runs-on: ubuntu-latest
    # Skipped silently when the token is absent, so forks can tag without failing.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "No CARGO_REGISTRY_TOKEN set; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked
