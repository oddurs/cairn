name: cla

# Signatures are stored in this repository rather than in a third-party service,
# which is the same argument cairn makes about everything else: state belongs in
# the repository, where it can be read, reviewed and moved.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        # Only acts on the agreement phrase or on a pull request; other comments
        # are ignored.
        if: >
          (github.event_name == 'issue_comment' &&
           github.event.comment.body == 'I have read the CLA and I agree to its terms')
          || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: main
          path-to-signatures: .github/contributors.json
          path-to-document: https://github.com/oddurs/cairn/blob/main/CLA.md
          allowlist: oddurs,dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for this. Before it can be merged, please read the
            [contributor licence agreement](https://github.com/oddurs/cairn/blob/main/CLA.md)
            — it is short, you keep the copyright in what you wrote, and
            [CONTRIBUTING](https://github.com/oddurs/cairn/blob/main/CONTRIBUTING.md#why-there-is-an-agreement)
            explains plainly why it exists. Then leave a comment on this pull
            request saying exactly:
          custom-pr-sign-comment: "I have read the CLA and I agree to its terms"
          custom-allsigned-prcomment: >
            Agreement recorded. Thank you — you will not be asked again.
