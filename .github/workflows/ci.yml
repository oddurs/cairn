name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so the soak explores sequences a per-push run has no time for.
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tier 1. Linux is the reference platform: where behaviour is defined when
  # platforms disagree, and what the release binaries are built from.
  linux:
    name: linux (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # musl is what ships, so it is what CI proves.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cargo test --target x86_64-unknown-linux-musl

  # Tier 2. Supported: bugs here are bugs, not caveats.
  portability:
    name: ${{ matrix.name }} (tier 2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test

  # The declared rust-version is a promise; this checks it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  roadmap:
    # cairn keeps its own roadmap: the committed ROADMAP.md must match the
    # items, and every item must satisfy the schema in cairn.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: ./target/debug/cairn check --render --strict

  soak:
    # Drives cairn through a long random sequence of ordinary operations and
    # checks the backlog after every step. Short on a push, long overnight.
    # The seed is printed; a failure is reproduced by passing it back.
    runs-on: ubuntu-latest
    env:
      CAIRN_SOAK_SEED: ${{ github.run_id }}
      CAIRN_SOAK_OPS: ${{ github.event_name == 'schedule' && 4000 || 400 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test soak --release -- --ignored --nocapture

  coverage:
    # A ratchet rather than a target. A change that drops below the floor has
    # removed a test or added a surface nobody drove, and either is worth
    # stopping for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage

  supply-chain:
    # Advisories, licences, and where crates came from. A tool people keep years
    # of project history in should not carry a known vulnerability quietly, and
    # a project people are told they may build on freely should not acquire a
    # copyleft transitive licence without somebody deciding to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  packaging:
    # What `cargo publish` will make of this, checked continuously rather than
    # at tag time. Packaging failures — a file the manifest excludes that the
    # build needs, a crate over the size limit, a path dependency — are
    # invisible to `cargo build` and surface only on publish, which in this
    # workflow happens after the binaries are already out. Better here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
      # The tarball a packager gets has to be buildable on its own. `git
      # archive` is a different file list from `cargo package`, and nothing was
      # checking that one of them still compiles.
      - run: make dist
      - name: Build the source tarball the way a packager would
        run: |
          set -eu
          f=$(ls cairn-*.tar.gz)
          mkdir -p /tmp/from-tarball
          tar xzf "$f" -C /tmp/from-tarball
          cd /tmp/from-tarball/cairn-*/
          cargo build --release --locked
          ./target/release/cairn --version

  site:
    # The site restates nothing — it renders the specification and the recorded
    # demo from the repository — so a change to either can break it. This
    # catches that on the pull request rather than after merging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
        working-directory: www
      - run: npm run build
        working-directory: www

  conformance:
    # A second reader, written from spec/README.md alone and not from cairn's
    # source, run over the same corpus. When the two disagree one of them is
    # wrong — which is how the specification came to say *which* YAML it means.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 spec/conformance.py

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texinfo
      - run: makeinfo --output=/dev/null doc/cairn.texi

  recordings:
    # The README demo and the website's terminal samples are both captured from
    # real command output, so a change in behaviour that nobody re-recorded
    # shows up here rather than as a stale picture or a page that lies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: python3 doc/demo.py
      - run: python3 doc/samples.py
      # AGENTS.md is generated too, and drifted two sprints before anybody
      # noticed — a file that tells agents the schema, quietly describing an
      # older one.
      - run: ./target/release/cairn agent --write AGENTS.md
      - run: git diff --exit-code doc/demo.svg doc/samples.json AGENTS.md
        # If this fails: run `make record` and commit the result.
